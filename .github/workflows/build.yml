name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Java 21 / NeoForge 21.1.176)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Show produced artifacts
        run: ls -lh build/libs

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: epca-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  validate-resources:
    name: Validate JSON resources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse every JSON resource
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          files = sorted(pathlib.Path("src").rglob("*.json"))
          bad = []
          for p in files:
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as exc:  # noqa: BLE001
                  bad.append(f"{p}: {exc}")

          print(f"checked {len(files)} JSON files")
          if bad:
              print("\n".join(bad[:50]))
              sys.exit(1)
          PY
